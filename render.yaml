services:
  - type: web
    name: pinky-checkpoint-tutor
    runtime: python
    branch: chore/deploy
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python demo/demo_server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
