# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Quy mô từ evidence/data-mining.md; hành vi/tỷ trọng là tự ước tính theo spec §2.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 177
  base: 213
  high: 431
  source: "evidence/data-mining.md và spec.md §1–2: 177 học viên tua lùi, 213 mở lại video, 431 từng mở video. Dùng ba nhóm làm kịch bản triển khai (tự ước tính), không cộng các nhóm chồng lấn."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 2       # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "(tự ước tính) spec.md §2: nhóm tra cứu 1–2 lần/tháng, chọn 2; tỷ trọng 50%, mỗi phiên 1 checkpoint, chưa khảo sát."
  - name: dung_vua
    share: 0.3
    uses_per_month: 6
    turns_per_session: 2
    source: "(tự ước tính) spec.md §2: nhóm học đều 4–6 lần/tháng, chọn 6; tỷ trọng 30%, mỗi phiên 2 checkpoint, chưa khảo sát."
  - name: dung_nhieu
    share: 0.2
    uses_per_month: 10
    turns_per_session: 3
    source: "(tự ước tính) spec.md §2: nhóm bận 8–10 lần/tháng, chọn 10; tỷ trọng 20%, mỗi phiên 3 checkpoint, chưa khảo sát."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gpt-5.4-mini-2026-03-17
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/models/gpt-5.4-mini.md · xem 27/11/2026 · Standard text USD/1M token; tính toàn bộ input theo giá không cache (ước tính bảo thủ)."
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://aistudio.google.com/docs/pricing#gemini-3.1-flash-lite · xem 27/11/2026 · Standard paid text USD/1M token"
  - model: gemini-3.5-flash-lite
    input: 0.30
    output: 2.50
    source: "https://aistudio.google.com/docs/pricing#gemini-3.5-flash-lite · xem 27/11/2026 · Standard paid text USD/1M token"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
